name: docs

on:
  # Sin filtro de `paths`: `markdownlint` y `links` son checks requeridos por la
  # ruleset de `main`. Si se filtran por ruta, un PR que no toca Markdown nunca
  # los reporta y queda bloqueado para siempre (no "pendiente": nunca corren).
  # Ambos jobs lintean todo el repo, así que correrlos siempre es correcto y barato.
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline valida que los links locales/relativos resuelvan,
          # sin depender de la red ni de URLs externas (evita flakiness).
          args: "--offline --no-progress 'docs/**/*.md' '*.md'"
          fail: true
