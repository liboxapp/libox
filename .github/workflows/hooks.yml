name: hooks

# Los guards del OS de IA (scripts/hooks/) son código de infraestructura del
# equipo: se prueban como cualquier otro. Matriz 3.9/3.12 porque las máquinas
# de desarrollo corren Python 3.9 y el CI 3.12.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests de los guards
        run: python3 -m unittest discover -s scripts/hooks/tests -v
      - name: Tests de las políticas de CI
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Tests de ejecuciones de auditoría
        run: python3 -m unittest discover -s scripts/audit/tests -v
      - name: Dependencias de validación contractual
        run: python3 -m pip install -r scripts/contracts/requirements.txt
      - name: OpenAPI, ejemplos y mock HTTP
        run: python3 -m unittest discover -s scripts/contracts/tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.python == '3.12'
        with:
          node-version: "22"
      - name: Tipos y cliente TypeScript contra mock local
        if: matrix.python == '3.12'
        run: |
          npm ci --prefix scripts/contracts/typescript --ignore-scripts --no-audit --no-fund
          python3 scripts/contracts/check_typescript.py
      - name: Tests estáticos del overlay SQL y limpieza de contenedores
        run: python3 -m unittest discover -s scripts/database/tests -v
      - name: PostgreSQL 17 efímero y negativos de permisos/particiones
        if: matrix.python == '3.12'
        env:
          LIBOX_DB_DOCKER: "1"
        run: |
          docker pull postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
          python3 -m unittest discover -s scripts/database/tests -v
      - name: settings.json es JSON válido y sus hooks apuntan a scripts existentes
        run: |
          python3 - <<'PY'
          import json, re, os, sys
          cfg = json.load(open(".claude/settings.json"))
          missing = []
          for event, groups in cfg.get("hooks", {}).items():
              for group in groups:
                  for h in group.get("hooks", []):
                      for m in re.findall(r"\$\{CLAUDE_PROJECT_DIR\}/([^\"]+)", h.get("command", "")):
                          if not os.path.exists(m):
                              missing.append(m)
          if missing:
              sys.exit("hooks referencian scripts inexistentes: %s" % missing)
          print("settings.json OK")
          PY
