name: outline-sync

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "scripts/outline-map.json"
      - "scripts/outline-sync.sh"
      - "scripts/outline-ignore.txt"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-map:
    name: Every doc is mapped or ignored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check outline-map coverage
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          mapped = set(json.load(open("scripts/outline-map.json", encoding="utf-8")))
          rules = [l.strip() for l in open("scripts/outline-ignore.txt", encoding="utf-8")
                   if l.strip() and not l.lstrip().startswith("#")]
          prefixes = tuple(r for r in rules if r.endswith("/"))
          exact = {r for r in rules if not r.endswith("/")}
          tracked = subprocess.check_output(["git", "ls-files", "--", "docs"], text=True).splitlines()
          missing = 0
          for f in sorted({t for t in tracked if t.endswith(".md")}):
              if f in mapped or f in exact or f.startswith(prefixes):
                  continue
              print(f"::error file={f}::not in scripts/outline-map.json nor scripts/outline-ignore.txt — map it (bootstrap the Outline doc first) or ignore it explicitly")
              missing = 1
          sys.exit(missing)
          PY

  sync:
    name: Sync docs to Outline mirror
    needs: check-map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install outline-cli
        run: pip install --quiet outline-kb-cli
      - name: Sync to Outline
        env:
          OUTLINE_API_KEY: ${{ secrets.OUTLINE_API_KEY }}
          OUTLINE_BASE_URL: https://liboxapp.getoutline.com/api
        run: |
          # Manual dispatch → full resync of every mapped doc.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash scripts/outline-sync.sh
            exit 0
          fi
          # Map/script changes → full resync (a doc may have been added to the map
          # without its content changing in the same commit).
          infra=$(git diff --name-only HEAD^ HEAD -- scripts/outline-map.json scripts/outline-sync.sh || true)
          if [ -n "$infra" ]; then
            bash scripts/outline-sync.sh
            exit 0
          fi
          # Otherwise sync only the docs touched by this push.
          changed=$(git diff --name-only HEAD^ HEAD -- docs | grep -E '\.md$' || true)
          if [ -z "$changed" ]; then
            echo "no doc changes detected"
            exit 0
          fi
          # shellcheck disable=SC2086
          bash scripts/outline-sync.sh $changed
