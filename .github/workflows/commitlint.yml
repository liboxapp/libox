name: commitlint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
      # Autoría corporativa: en el plan Free no hay metadata restrictions
      # (Enterprise), así que el dominio del correo se valida aquí. Los bots
      # (release-please) quedan exentos. Guía para devs: docs/onboarding.md.
      - name: Correos de autor de la organización
        run: |
          fail=0
          while read -r hash email; do
            if [[ ! "$email" =~ @liboxapp\.com$ ]] && [[ ! "$email" =~ \[bot\]@users\.noreply\.github\.com$ ]]; then
              echo "::error::Commit $hash con correo fuera de la organización: $email (usa git config user.email <tu>@liboxapp.com — ver docs/onboarding.md)"
              fail=1
            fi
          done < <(git log --format='%h %ae' "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          exit $fail
