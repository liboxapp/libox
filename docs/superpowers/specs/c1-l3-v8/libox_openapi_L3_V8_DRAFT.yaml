      type: object
      description: Prueba pública; fixture sintético solo estructural, no vector criptográfico. H-10/H-11/H-12
        abiertos; fuente y serialización deben cerrarse antes de C2.
      required:
      - algorithm_version
      - raffle_id
      - raffle_code
      - pool
      - commitment
      - beacon
      - reveal
      - derivation
      - winners
      - trace_id
      properties:
        algorithm_version:
          type: string
          example: libox-draw-1.0
        raffle_id:
          type: string
          format: uuid
        raffle_code:
          type: string
        sequence:
          type: integer
          description: 2 indica re-sorteo
        pool:
          type: object
          properties:
            size:
              type: integer
            canonical_string_prefix:
              type: string
            hash:
              type: string
              pattern: ^[0-9a-f]{64}(?![\s\S])
            snapshot_url:
              type: string
              format: uri
            snapshot_hash:
              type: string
              pattern: ^[0-9a-f]{64}(?![\s\S])
          additionalProperties: false
          required:
          - size
          - canonical_string_prefix
          - hash
          - snapshot_url
          - snapshot_hash
        commitment:
          type: object
          properties:
            value:
              type: string
              pattern: ^[0-9a-f]{64}(?![\s\S])
            published_at:
              type: string
              format: date-time
            earliest_execution_at:
              type: string
              format: date-time
          additionalProperties: false
          required:
          - value
          - published_at
          - earliest_execution_at
        beacon:
          type: object
          description: 'round_kind, round_value y round_time son la propiedad INTRÍNSECA de la ronda.

            Son lo que permite verificar contra la fuente pública que la ronda no existía

            al comprometer. retrieved_at es operativo y carece de valor probatorio.

            '
          properties:
            source:
              type: string
            source_url:
              type: string
              format: uri
            ref:
              type: string
            round_kind:
              type: string
              enum:
              - ROUND_NUMBER
              - BLOCK_HEIGHT
              - ROUND_TIME
            round_value:
              type: string
              description: Identificador intrínseco de ronda (no aleatoriedad).
            round_time:
              type: string
              format: date-time
            value:
              type: string
              description: Bytes de aleatoriedad codificados según randomness_encoding; no número de ronda.
            retrieved_at:
              type: string
              format: date-time
            randomness_encoding:
              type: string
              enum:
              - HEX
              - BASE64
          additionalProperties: false
          required:
          - source
          - source_url
          - ref
          - round_kind
          - round_value
          - round_time
          - value
          - retrieved_at
          - randomness_encoding
        reveal:
          type: object
          properties:
            server_seed:
              type: string
              pattern: ^[0-9a-f]{64}(?![\s\S])
          additionalProperties: false
          required:
          - server_seed
        derivation:
