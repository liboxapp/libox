                type: 'null'
        else:
          properties:
            expiry_policy:
              type: 'null'
      - if:
          anyOf:
          - properties:
              raffle_type:
                const: T7
            required:
            - raffle_type
          - properties:
              base_type:
                const: T7
            required:
            - base_type
