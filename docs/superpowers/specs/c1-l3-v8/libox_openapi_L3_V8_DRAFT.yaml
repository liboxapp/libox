components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Supabase de 15 min + sesión y permisos autoritativos de Libox.
    pspSignature:
      type: apiKey
      in: header
      name: x-signature
      description: 'HMAC-SHA256 Mercado Pago, header ts=<timestamp>,v1=<firma>. El manifiesto usa data.id
        del query, x-request-id y ts; no el cuerpo completo. apiKey solo representa el header en OpenAPI:
        no prueba validación criptográfica.'
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Credencial exclusiva de servicio con audiencia y acción limitadas; no aceptar JWT de
        usuario ni service-role de Supabase expuesto.
  schemas:
    Money:
      type: object
      properties:
        amount:
          type: string
          minLength: 1
          pattern: ^(?:0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)(?![\s\S])
          maxLength: 19
        currency:
          type: string
          minLength: 3
          pattern: ^[A-Z]{3}(?![\s\S])
          maxLength: 3
      required:
      - amount
      - currency
      additionalProperties: false
      description: Unidad mínima como cadena decimal, rango 0..9223372036854775807. Ratificado por Diego
        el 2026-09-30. No usar Number para cálculos patrimoniales.
    Probability:
      type: object
      properties:
        fraction:
          type: string
          minLength: 1
        percent:
          type: number
          minimum: 0
          maximum: 100
        per_thousand_text:
          type: string
          minLength: 1
      required:
      - fraction
      - percent
      - per_thousand_text
      additionalProperties: false
    Pool:
      type: object
      properties:
        sold:
          type: integer
          minimum: 0
        total:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - sold
      - total
      additionalProperties: false
    Gates:
      type: object
      properties:
        g1_draw:
          type: boolean
        g2_delivery:
          type: boolean
        g3_disputes:
          type: boolean
        g4_chargeback:
          type: boolean
        g5_payout:
          type: boolean
        g6_ledger:
          type: boolean
      required:
      - g1_draw
      - g2_delivery
      - g3_disputes
      - g4_chargeback
      - g5_payout
      - g6_ledger
      additionalProperties: false
    EvidenceReference:
      type: object
      properties:
        evidence_id:
          type: string
          minLength: 1
          format: uuid
        sha256:
          type: string
          minLength: 1
          pattern: ^[0-9a-f]{64}(?![\s\S])
        status:
          type: string
          enum:
          - QUARANTINED
          - ACCEPTED
          - REJECTED
      required:
      - evidence_id
      - sha256
      - status
      additionalProperties: false
    EvidenceAttach:
      type: object
      properties:
        upload_id:
          type: string
          minLength: 1
          format: uuid
        sha256:
          type: string
          minLength: 1
          pattern: ^[0-9a-f]{64}(?![\s\S])
        description:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - upload_id
      - sha256
      - description
      additionalProperties: false
    ActionRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        reason:
          type: string
          minLength: 10
          maxLength: 2000
      required:
      - expected_version
      - reason
      additionalProperties: false
    AsyncReceipt:
      type: object
      properties:
        operation_id:
          type: string
          minLength: 1
          format: uuid
        status:
          type: string
          enum:
          - ACCEPTED
      required:
      - operation_id
      - status
      additionalProperties: false
    ContactChallenge:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
          format: uuid
        message:
          type: string
          minLength: 1
      required:
      - challenge_id
      - message
      additionalProperties: false
    AuthRegister:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        accepted_terms_version:
          type: string
          minLength: 1
      required:
      - email
