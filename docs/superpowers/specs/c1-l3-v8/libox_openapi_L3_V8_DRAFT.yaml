        dentro de límites. Diego y [LEGAL→ABOGADO].'
      - Premio que se entrega cuando se alcanza el mínimo sin agotar boletos.
      - Aviso al comprador antes de pagar (bases y checkout).
      - 'Regla aprobada: mínimo, premio y condiciones se fijan antes de publicar y no cambian tras la
        primera compra; hasta definirlos, un T1 no es publicable.'
      - 'La propuesta Cowork no ratificada no cambia el desenlace: bajo mínimo se cancela con reembolso.'
