    SignatureRequest:
      type: object
      properties:
        signature_request_id:
          type: string
          minLength: 1
          format: uuid
        action_code:
          type: string
          enum:
          - VALUATION_V2_COSIGN
          - VALUATION_V4
          - VALUATION_EXCEPTION
          - PC_STAGE_E3
          - PC_STAGE_E7
          - ATTEST_PC
          - CAPABILITY_PLATFORM_DISABLE
          - MARKET_RESUME
          - MULTIPLE_OVERRIDE
          - SUBROLE_GRANT
          - MFA_RESET_INTERNAL
        subject_kind:
          type: string
          enum:
          - VALUATION
          - PC_STAGE
          - ROOM
          - PLATFORM_CAPABILITY
          - MARKET
          - RAFFLE
          - SUBROLE_ASSIGNMENT
          - INTERNAL_USER
        subject_id:
          type: string
          minLength: 1
          format: uuid
        subject_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        requested_by:
          type: string
          minLength: 1
          format: uuid
        eligible_signer_subroles:
          type: array
          items:
            type: string
            enum:
            - SUPPORT_L1
            - SUPPORT_L2
            - SUPPORT_VALUATOR
            - SUPPORT_SUPERVISOR
            - SUPPORT_BEHAVIORAL_ANALYST
            - ADMIN_MODERATION
            - ADMIN_RISK
            - ADMIN_FINANCE
            - ADMIN_LEGAL_COMPLIANCE
            - ADMIN_COMPLIANCE
            - ADMIN_BEHAVIORAL
            - ADMIN_SUPER
          minItems: 1
          maxItems: 12
          uniqueItems: true
          description: Subroles que pueden firmar según x-second-signature-policy (A1). En VALUATION_EXCEPTION
            el servidor excluye el subrol de quien solicitó. No autoriza por sí mismo.
        status:
          type: string
          enum:
          - PENDING
          - SIGNED
          - DECLINED
          - CANCELLED
          - EXPIRED
        expires_at:
          type: string
          minLength: 1
          format: date-time
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - signature_request_id
      - action_code
      - subject_kind
      - subject_id
      - subject_version
      - requested_by
      - eligible_signer_subroles
      - status
      - expires_at
      - version
      additionalProperties: false
      allOf:
      - if:
          properties:
            action_code:
              const: VALUATION_V2_COSIGN
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_MODERATION
      - if:
          properties:
            action_code:
              const: VALUATION_V4
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_LEGAL_COMPLIANCE
      - if:
          properties:
            action_code:
              const: VALUATION_EXCEPTION
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - SUPPORT_VALUATOR
                - ADMIN_LEGAL_COMPLIANCE
                - ADMIN_SUPER
      - if:
          properties:
            action_code:
              const: PC_STAGE_E3
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_SUPER
      - if:
          properties:
            action_code:
              const: PC_STAGE_E7
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_SUPER
      - if:
          properties:
            action_code:
              const: ATTEST_PC
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_SUPER
      - if:
          properties:
            action_code:
              const: CAPABILITY_PLATFORM_DISABLE
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_SUPER
      - if:
          properties:
            action_code:
              const: MARKET_RESUME
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_SUPER
      - if:
          properties:
            action_code:
              const: MULTIPLE_OVERRIDE
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_SUPER
      - if:
          properties:
            action_code:
              const: SUBROLE_GRANT
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_SUPER
      - if:
          properties:
            action_code:
              const: MFA_RESET_INTERNAL
          required:
          - action_code
        then:
          properties:
            eligible_signer_subroles:
              items:
                enum:
                - ADMIN_SUPER
      description: 'Segunda firma por action_code (A1, aprobada el 2026-09-30): otra persona siempre;
        otro subrol salvo en acciones propias de ADMIN_SUPER, que firma otro ADMIN_SUPER. Firmar no concede
        escritura sobre el sujeto (A2). INC-09 e INC-11 se comprueban en ejecución: implementación humana.
        MULTIPLE_OVERRIDE solo fija el firmante, no la regla del múltiplo.'
      x-second-signature-policy:
        VALUATION_V2_COSIGN:
          requester_subroles:
          - SUPPORT_VALUATOR
          signer_subroles:
          - ADMIN_MODERATION
          signer_subrole_rule: DIFFERENT_SUBROLE
          signer_must_be_other_person: true
          grants_write: false
        VALUATION_V4:
          requester_subroles:
          - SUPPORT_VALUATOR
          signer_subroles:
          - ADMIN_LEGAL_COMPLIANCE
          signer_subrole_rule: DIFFERENT_SUBROLE
          signer_must_be_other_person: true
          grants_write: false
        VALUATION_EXCEPTION:
          requester_subroles:
          - SUPPORT_VALUATOR
          - ADMIN_LEGAL_COMPLIANCE
          signer_subroles:
          - SUPPORT_VALUATOR
          - ADMIN_LEGAL_COMPLIANCE
          - ADMIN_SUPER
          signer_subrole_rule: DIFFERENT_SUBROLE
          signer_must_be_other_person: true
          grants_write: false
        PC_STAGE_E3:
          requester_subroles:
          - ADMIN_LEGAL_COMPLIANCE
          signer_subroles:
          - ADMIN_SUPER
          signer_subrole_rule: DIFFERENT_SUBROLE
          signer_must_be_other_person: true
          grants_write: false
        PC_STAGE_E7:
          requester_subroles:
          - ADMIN_LEGAL_COMPLIANCE
          signer_subroles:
          - ADMIN_SUPER
          signer_subrole_rule: DIFFERENT_SUBROLE
          signer_must_be_other_person: true
          grants_write: false
        ATTEST_PC:
          requester_subroles:
          - ADMIN_LEGAL_COMPLIANCE
          signer_subroles:
          - ADMIN_SUPER
          signer_subrole_rule: DIFFERENT_SUBROLE
          signer_must_be_other_person: true
          grants_write: false
        CAPABILITY_PLATFORM_DISABLE:
          requester_subroles:
          - ADMIN_SUPER
          signer_subroles:
          - ADMIN_SUPER
          signer_subrole_rule: SAME_SUBROLE_ALLOWED
          signer_must_be_other_person: true
          grants_write: false
        MARKET_RESUME:
          requester_subroles:
          - ADMIN_SUPER
          signer_subroles:
          - ADMIN_SUPER
          signer_subrole_rule: SAME_SUBROLE_ALLOWED
          signer_must_be_other_person: true
          grants_write: false
        MULTIPLE_OVERRIDE:
          requester_subroles:
          - ADMIN_COMPLIANCE
          signer_subroles:
          - ADMIN_SUPER
          signer_subrole_rule: DIFFERENT_SUBROLE
          signer_must_be_other_person: true
          grants_write: false
        SUBROLE_GRANT:
          requester_subroles:
          - ADMIN_SUPER
          signer_subroles:
          - ADMIN_SUPER
          signer_subrole_rule: SAME_SUBROLE_ALLOWED
          signer_must_be_other_person: true
          grants_write: false
        MFA_RESET_INTERNAL:
          requester_subroles:
          - ADMIN_SUPER
          signer_subroles:
          - ADMIN_SUPER
          signer_subrole_rule: SAME_SUBROLE_ALLOWED
          signer_must_be_other_person: true
          grants_write: false
