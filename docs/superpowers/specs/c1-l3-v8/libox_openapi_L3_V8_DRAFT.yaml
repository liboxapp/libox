openapi: 3.1.0
info:
  title: Libox API — borrador contractual C1
  version: 2.0.0-draft.3
  description: 'Borrador no canónico: 61 operaciones del inventario L3 §11 (x-origin l3-inventory) más
    operaciones auxiliares C1 (x-origin c1-auxiliary). Esquemas de interfaz; no código de dominio. Money
    string ratificado el 2026-09-30. No desplegar: quedan decisiones indicadas en x-authorization-status
    y adaptadores externos. Fixtures sintéticos, no vectores financieros ni criptográficos. Cambio incompatible
    respecto V7: destino /api/v2 propuesto antes de emisión C2; no servir como reemplazo silencioso de
    v1. draft.3 integra las decisiones de dominio A1–A7, A9–A11 y C1–C4 aprobadas por Diego el 2026-09-30;
    lo que sigue sin dato aprobado se declara en x-c1-pending y no se anuncia completo.'
  x-artifact: libox_openapi_L3_V8_DRAFT.yaml
  x-target-document: L3 V8 (no emitido)
  x-implements: PRD MVP V9
  x-status: draft-not-for-deployment
  x-origin-values:
  - l3-inventory
  - c1-auxiliary
  x-c1-decisions-integrated:
  - A1
  - A2
  - A3
  - A4
  - A5
  - A6
  - A7
  - A9
  - A10
  - A11
  - C1
  - C2
  - C3
  - C4
  x-c1-pending:
  - 'A8: lista cerrada de documentos P-C por etapa (Diego y [LEGAL→ABOGADO]); P-C sigue bloqueado y sin
    operación de decisión de etapa.'
  - 'C1: mínimo vendido de T1 (umbral, unidad y quién lo fija), premio con mínimo y aviso al comprador;
    T1 no publicable hasta fijarlos.'
  - 'C4: enums charge_kind y macrozone (DP-25); recurring_charges y shipping_estimates no se contratan.'
  - 'C3: el simulador público conserva target_net_amount obligatorio y ticket_price opcional; decidir si
    adopta ticket_price como entrada principal.'
  - 'A1: apagado global de capacidad (CAPABILITY_PLATFORM_DISABLE) desbloqueado; sin operación en este
    borrador.'
  - 'A10: qué operaciones del inventario L3 cuentan como acción sensible con reautenticación.'
  - 'Configuración T2–T6, fechas de venta y documento de mercado: solo diseño.'
  - 'Propuesta Cowork (mínimo económico, cobertura y desenlaces): no ratificada y no contratada.'
  - 'adjudicateDispute conserva second_signer_id: fuera del alcance de A9.'
servers:
- url: /api/v2
  description: Base candidata por cambio incompatible de Money; pendiente de emisión C2.
security:
- bearerAuth: []
